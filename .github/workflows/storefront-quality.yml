name: storefront-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storefront-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Generate Next.js route types
        run: npx next typegen
      - name: TypeScript type check
        run: npm run typecheck
      - name: Run ESLint
        if: always()
        run: npm run lint
      - name: Build production application
        if: always()
        run: npm run build

  stock-migration-integration:
    name: PostgreSQL stock migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create synthetic database schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/wa01_stock_schema.sql
      - name: Apply the stock migration under test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022180345_fail_closed_order_stock_races.sql
      - name: Run stock regression and transaction rollback tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/wa01_stock_integrity.sql
      - name: Run concurrent last-unit test
        run: bash supabase/tests/wa01_stock_concurrency.sh
